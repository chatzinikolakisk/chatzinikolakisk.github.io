# yaml-language-server: $schema=https://raw.githubusercontent.com/rendercv/rendercv/refs/tags/v2.3/schema.json
cv:
  name: Konstantinos Chatzinikolakis
  location: Irakleion, Crete, Greece
  email: chatzinikolakisk@gmail.com
  website: https://chatzinikolakisk.github.io
  social_networks:
    - network: LinkedIn
      username: chatzinikolakisk
  sections:
    summary:
      - Engineering leader with a hands-on backend background. Eight years from IC to director, modernizing platforms and growing engineers along the way. I treat software engineering as intellectual property and care equally about the human side of building it.
    experience:
      - company: Epignosis
        position: Enterprise Engineering Director
        start_date: 2025-10
        end_date: present
        location: Remote
        highlights:
          - Lead 31 engineers across 3 SaaS products through product and platform team leads (engineering and QA); report to CTO.
          - Delivered the cross-product seamless login PoC, then transferred ownership for scale-out as part of a platform unification initiative.
          - "Set engineering excellence direction for one product: event-driven architecture, domain-driven service isolation, and a foundation other teams can build on."
          - "Stayed hands-on: ran pair code reviews, migrated CI for one product (caught silently-failing static analysis), and contributed where infrastructure had dark corners."
          - Grew team leads to stand on their own feet, coaching them to define end states, hold hard conversations, and make decisions without escalating; promoted a new team lead from within.
      - company: Epignosis
        position: Head of Engineering & Product
        start_date: 2025-01
        end_date: 2025-10
        location: Remote
        highlights:
          - Ran a ~20-person org spanning product, development, and technical operations through a delegated leadership layer.
          - Introduced written product requirements and technical design discipline before development to cut rework and align expectations early.
          - Expanded delivery capacity by forming an additional crew and splitting work into product streams with clearer focus.
          - Shifted the org to a release-driven cadence, using shipped releases as the feedback signal for lean, iterative delivery.
      - company: Epignosis
        position: Lead Software Engineer
        start_date: 2024-01
        end_date: 2025-01
        location: Remote
        highlights:
          - "Drove platform modernization: removed long-standing legacy modules and introduced internal service boundaries the team could build on top of."
          - Introduced an internal query API to decouple consumers from the data layer, reducing coupling between domains.
          - Hardened deployment safety with canary release flows and automated PR governance, reducing incident surface area.
          - Improved testability through configuration and time abstractions enforced by custom static-analysis rules.
      - company: Epignosis
        position: Senior Software Engineer Team Lead
        start_date: 2022-09
        end_date: 2024-01
        location: Remote
        highlights:
          - Modernized the product's frontend stack and split the backend into an API-driven architecture to decouple client and server concerns.
          - Restructured teams for clearer ownership and faster delivery; expanded hiring and cross-team collaboration.
          - Raised the code quality bar with strict typing, custom static-analysis rules enforcing domain boundaries, and test-coverage discipline in CI.
          - Established CI/CD pipelines, branching strategy, and automated governance so quality gates ran by default, not by review effort.
      - company: Epignosis
        position: Software Engineer
        start_date: 2020-01
        end_date: 2022-09
        location: Remote
        highlights:
          - Built the authentication mechanism for a new REST API service from the ground up.
          - Built new domain endpoints (catalog, calendar, discussions, branches) on top of a legacy monolithic backend.
          - "Drove engineering practices: test-driven development, a cross-team RFC process, and OpenAPI documentation as the contract source of truth."
      - company: Earlier Roles
        position: Early Career
        start_date: 2018-03
        end_date: 2019-12
        highlights:
          - Hellenic Army (mandatory military service, 2018) · Junior PHP Developer at Epignosis (2019).
    education:
      - institution: University of the Aegean
        area: Information and Communication Systems Engineering
        degree: MEng
        end_date: 2018-11
    skills:
      - label: Leadership
        details: Mentoring & Coaching, Cross-Functional Collaboration, Agile Delivery
      - label: Architecture & Practices
        details: Software Architecture, Domain-Driven Design, Event-Driven Architecture, Test-Driven Development, CI/CD, Code Quality & Standards
      - label: Engineering
        details: PHP, MySQL, REST APIs, GraphQL, Vue, Tailwind, Containers & Docker, Static Analysis, Legacy Modernization
      - label: Languages
        details: Greek (native), English (professional working)
design:
  # Theme options: classic, ember, engineeringclassic, engineeringresumes,
  # harvard, ink, moderncv, opal, sb2nov. Themes only set defaults — any field
  # explicitly set below overrides the theme.
  theme: classic

  page:
    size: us-letter # a4 | a5 | us-letter | us-executive
    top_margin: 1.2cm # units: cm | mm | in | pt
    bottom_margin: 1.2cm
    left_margin: 1.5cm
    right_margin: 1.5cm
    show_page_numbering: false # bool
    show_last_updated_date: false # bool (theme default: true)

  colors:
    # rgb(r,g,b) | hex like "#004f90" | named colors
    text: "#2E3D50"
    name: "#2E3D50"
    connections: rgb(0, 0, 0)
    section_titles: "#2E3D50"
    links: "#2E3D50"
    last_updated_date_and_page_numbering: rgb(128, 128, 128)

  text:
    # Built-in fonts: DejaVu Sans Mono, EB Garamond, Fontin, Gentium Book Plus,
    # Lato, Libertinus Serif, Mukta, New Computer Modern, Noto Sans, Open Sans,
    # Open Sauce Sans, Poppins, Raleway, Roboto, Source Sans 3, Ubuntu, XCharter.
    # System fonts and custom fonts also supported.
    font_family: XCharter
    font_size: 9pt # try 9pt-11pt to fit content
    leading: 0.5em # line spacing; lower = tighter
    alignment: left # left | justified | justified-with-no-hyphenation
    date_and_location_column_alignment: right # left | right

  links:
    underline: true # bool
    use_external_link_icon: false # bool

  header:
    name_font_family: XCharter
    name_font_size: 18pt
    name_bold: true # bool
    small_caps_for_name: false # bool
    photo_width: 3.5cm
    vertical_space_between_name_and_connections: 0.3cm
    vertical_space_between_connections_and_first_section: 0.4cm
    horizontal_space_between_connections: 0.2cm # here
    connections_font_family: XCharter
    separator_between_connections: "" # any string, e.g. '·', '•', ''
    use_icons_for_connections: true # bool
    use_urls_as_placeholders_for_connections: true # bool
    make_connections_links: true # bool
    alignment: center # left | center | right

  section_titles:
    # Type options: with-full-line, with-partial-line, without-line, moderncv
    type: with-full-line
    font_family: XCharter
    font_size: 1.2em
    bold: true # bool
    small_caps: false # bool
    line_thickness: 0.5pt
    vertical_space_above: 0.35cm
    vertical_space_below: 0.2cm

  entries:
    date_and_location_width: 3.3cm
    left_and_right_margin: 0cm
    horizontal_space_between_columns: 0.1cm
    vertical_space_between_entries: 0.3cm
    allow_page_break_in_sections: true # bool
    allow_page_break_in_entries: true # bool
    short_second_row: true # bool
    show_time_spans_in: [] # list of section names, e.g. [experience]

  highlights:
    bullet: • # • ● ◦ - ◆ ★ ■ — ○
    nested_bullet: "-"
    top_margin: 0.15cm
    left_margin: 0cm
    vertical_space_between_highlights: 0.12cm
    horizontal_space_between_bullet_and_highlight: 0.3em
    summary_left_margin: 0cm

  # Advanced: override how each entry type is rendered.
  # Placeholders: NAME, COMPANY, POSITION, INSTITUTION, AREA, DEGREE,
  # LOCATION, DATE, SUMMARY, HIGHLIGHTS, URL, JOURNAL, AUTHORS, TITLE,
  # LABEL, DETAILS, PAGE_NUMBER, TOTAL_PAGES.
  entry_types:
    one_line_entry:
      template: "**LABEL:** DETAILS"
    education_entry:
      main_column_first_row_template: "**INSTITUTION**, DEGREE in AREA -- LOCATION"
      degree_column_template:
      degree_column_width: 1cm
      main_column_second_row_template: |-
        SUMMARY
        HIGHLIGHTS
      date_and_location_column_template: DATE
    normal_entry:
      main_column_first_row_template: "**NAME** -- **LOCATION**"
      main_column_second_row_template: |-
        SUMMARY
        HIGHLIGHTS
      date_and_location_column_template: DATE
    experience_entry:
      main_column_first_row_template: "**POSITION**, COMPANY -- LOCATION"
      main_column_second_row_template: |-
        SUMMARY
        HIGHLIGHTS
      date_and_location_column_template: DATE
    publication_entry:
      main_column_first_row_template: "**TITLE**"
      main_column_second_row_template: |-
        AUTHORS
        URL (JOURNAL)
      main_column_second_row_without_journal_template: |-
        AUTHORS
        URL
      main_column_second_row_without_url_template: |-
        AUTHORS
        JOURNAL
      date_and_location_column_template: DATE

locale:
  language: en
  phone_number_format: international # national | international | E164
  page_numbering_template: NAME - Page PAGE_NUMBER of TOTAL_PAGES
  last_updated_date_template: Last updated in TODAY
  date_template: MONTH_ABBREVIATION YEAR
  month: month
  months: months
  year: year
  years: years
  present: present
  to: –
  abbreviations_for_months:
    [Jan, Feb, Mar, Apr, May, June, July, Aug, Sept, Oct, Nov, Dec]
  full_names_of_months:
    [
      January,
      February,
      March,
      April,
      May,
      June,
      July,
      August,
      September,
      October,
      November,
      December,
    ]

rendercv_settings:
  # Wraps any matching word/phrase in **bold** automatically.
  bold_keywords: []
  # Sort entries within each section: none | date-asc | date-desc | alphabetical
  sort_entries: none
